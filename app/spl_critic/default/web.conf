# Expose splunkd REST endpoints to Splunk Web (needed for UI fetches via /splunkd/__raw).

[expose:spl_critic_health]
pattern = spl_critic/health
methods = GET

[expose:spl_critic_critique]
pattern = spl_critic/critique
methods = GET,POST

[expose:spl_critic_audit]
pattern = spl_critic/audit
methods = GET,POST

[expose:spl_critic_rules]
pattern = spl_critic/rules
methods = GET,POST

[expose:spl_critic_environment]
pattern = spl_critic/environment
methods = GET

[expose:spl_critic_inference]
pattern = spl_critic/inference
methods = GET,POST

[expose:spl_critic_config]
pattern = spl_critic/config
methods = GET,POST
