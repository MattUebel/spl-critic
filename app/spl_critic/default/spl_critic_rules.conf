# Environment-local anti-pattern rules — extend SPL Critic without rebuilding.
# Manage via POST /services/spl_critic/rules (writes local/) or deploy your own
# local/spl_critic_rules.conf. One stanza per rule; stanza name is the code
# (UPPER_SNAKE, LOCAL_ prefix recommended; shipped catalog codes cannot be
# overridden). Custom rules participate in verdicts, scores, prompts, and the
# Auditor exactly like shipped rules.
#
# Example:
# [LOCAL_FROZEN_ARCHIVE_SCAN]
# label = Search against the frozen archive index
# severity = high              # info | low | medium | high | critical
# regex = (?i)index=frozen_archive
# scope = retrieval            # retrieval (first stage) | pipeline (whole SPL)
# risk_weight = 70             # optional 0-100; defaults derived from severity
# cost_weight = 80
# cost_rationale = frozen_archive is 40TB on slow storage; scans take hours.
# risk_rationale = Ties up scheduler slots for the whole org.
# canonical_rewrite = Use index=hot_web for the last 90 days; open a ticket for archive pulls.
# enabled = 1
