# SPL Critic — AI-powered second opinions for Splunk searches.
# version/build are stamped from pyproject.toml by `uv run spl-critic build`.

[install]
is_configured = false
state = enabled
build = 1789493348

[ui]
is_visible = true
label = SPL Critic
# Declare theme support so the user-preference theme picker works in this app
# context (built-in pages follow it; our dashboards pin dark below).
supported_themes = light, dark

[launcher]
author = Matt Uebel
description = AI-powered second opinions for your Splunk searches: agent-judged SPL critique and scheduled-search auditing.
version = 0.5.0

[package]
id = spl_critic
check_for_updates = false
