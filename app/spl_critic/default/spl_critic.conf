# SPL Critic app configuration. Override in local/spl_critic.conf.
# The OpenRouter API key is NOT configured here — it lives in the encrypted
# credential store (set via POST /services/spl_critic/config).

[llm]
enabled = 1
# Comma-separated OpenRouter model ids: first is primary, rest are fallbacks.
# Decision record in docs/model-eval.md; update after re-evals.
models = deepseek/deepseek-v4-pro,deepseek/deepseek-v4-flash
timeout = 60
# Hybrid-model reasoning tokens: 0 = disabled (fast interactive critiques —
# measured 55s with reasoning vs seconds without), 1 = enabled (deeper analysis).
reasoning = 0

[prompt]
# Free text appended to the LLM system prompt — environment-specific context
# (index sizes, naming conventions, local policy). Set via
# POST /services/spl_critic/config {"extra_guidance": "..."} or local conf.
extra_guidance =
