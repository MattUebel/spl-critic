# Persistent inference cache + history. Flexible types (enforceTypes=false) so
# the record shape can evolve; created_at accelerated for sorted history scans.
[spl_critic_inference]
enforceTypes = false
field.created_at = number
field.cost_usd = number
field.risk_score = number
field.cost_score = number
accelerated_fields.created = {"created_at": -1}

[spl_critic_audit_runs]
enforceTypes = false
field.created_at = number
field.total = number
field.blocked = number
field.retire = number
accelerated_fields.created = {"created_at": -1}

# Full audit-run payloads (reopenable runs), keyed by run_id. The payload is a
# single JSON string field — KV Store handles flat records best; the flat
# numeric fields beside it serve the runs list and count-capped pruning.
[spl_critic_audit_results]
enforceTypes = false
field.created_at = number
field.total = number
field.blocked = number
field.retire = number
field.analyzed = number
accelerated_fields.created = {"created_at": -1}
