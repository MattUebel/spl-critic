# REST endpoints for SPL Critic.
# Entry scripts live in bin/ and import the vendored lib/spl_critic_app package.
# NOTE: passPayload = true (camelCase!) is required on any endpoint that reads
# a request body — without it splunkd silently drops the payload and handlers
# only see query params.

[script:spl_critic_health]
match = /spl_critic/health
script = health_handler.py
scripttype = persist
handler = health_handler.HealthHandler
python.version = python3

[script:spl_critic_critique]
passPayload = true
match = /spl_critic/critique
script = critique_handler.py
scripttype = persist
handler = critique_handler.CritiqueHandler
python.version = python3

[script:spl_critic_audit]
passPayload = true
match = /spl_critic/audit
script = audit_handler.py
scripttype = persist
handler = audit_handler.AuditHandler
python.version = python3

[script:spl_critic_rules]
passPayload = true
match = /spl_critic/rules
script = rules_handler.py
scripttype = persist
handler = rules_handler.RulesHandler
python.version = python3
capability.post = admin_all_objects

[script:spl_critic_environment]
match = /spl_critic/environment
script = environment_handler.py
scripttype = persist
handler = environment_handler.EnvironmentHandler
python.version = python3

[script:spl_critic_inference]
passPayload = true
match = /spl_critic/inference
script = inference_handler.py
scripttype = persist
handler = inference_handler.InferenceHandler
python.version = python3

[script:spl_critic_config]
passPayload = true
match = /spl_critic/config
script = config_handler.py
scripttype = persist
handler = config_handler.ConfigHandler
python.version = python3
capability.post = admin_all_objects
